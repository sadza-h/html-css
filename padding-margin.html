<html>
    <head>
        <title>Padding&Maring</title>
        <style>

            .heading {
                border: 1px solid black;
                padding-left: 20px;
            }

            .box {
                margin-top: 50px;
                padding: 10px;
                background-color: blue;
                color: white;
            }

            .div{
                margin-top: 50px;
                border: 1px solid red;
                width: 100px;
                height: 100px;
            }


        </style>
    </head>

    <body>
        <h1 class="heading">Hello</h1>


        <p class="heading">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>


        <a class="heading box">Link</a>


        <div class="div"></div>

    </body>
</html>
